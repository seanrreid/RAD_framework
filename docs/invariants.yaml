# RAD invariant registry. See docs/invariants.md.
# Each enforced_by symbol is a LITERAL substring that must appear in its file;
# scripts/lint-invariants.sh fails closed when any anchor stops resolving.
version: 1
invariants:
  - id: unapproved-deliver-cannot-run
    claim: "No deliver run executes a wave unless the gate fold finds an architect-role approved event for the feature."
    authority: "the append-only event log .agents/state/<feature>/events.jsonl, folded by harness/gates.js against harness/gates.yaml"
    evals: [harness/evals/approval.eval.js]
    enforced_by:
      - { file: harness/gates.js, symbol: "export function evaluateGate", note: "the only gate fold" }
      - { file: harness/events.js, symbol: "event.type === 'approved'" }
      - { file: harness/cli.js, symbol: "branchTipApprovedGate", note: "worktree mode: gate read from the work-branch tip" }
      - { file: harness/cli.js, symbol: "setupMainRun" }
      - { file: harness/spine.js, symbol: "state.gate(feature, 'approved')" }
      - { file: scripts/check-plan-approved.sh, symbol: "approved --stdin" }
      - { file: harness/cli.js, symbol: "export function isMainModule", note: "realpath main-module guard: a symlinked invocation still runs the gate (#168)" }
      - { file: scripts/check-plan-approved.sh, symbol: "readonly GATE_PASSED_TOKEN", note: "exit 0 without passed=true fails closed — a CLI that never ran is not a pass (#168)" }
      - { file: scripts/check-approval-integrity.sh, symbol: "merge-base --is-ancestor", note: "CI: approval is an ancestor of the PR head" }
      - { file: scripts/deliver-gate-hook.mjs, symbol: "function block", note: "PreToolUse hook blocks an unapproved /rad-deliver (exit 2)" }
      - { file: .claude/settings.json, symbol: "deliver-gate-hook.mjs", note: "hook registration" }
      - { file: .rad/skills/rad-deliver/SKILL.md, symbol: "node harness/cli.js deliver", note: "the shared rad-deliver skill (Claude command and Codex skill) only runs rad deliver, so the harness gate is the gate on both tools; the Claude hook is an extra layer" }
      - { file: harness/claude-settings.js, symbol: "export function mergeDeliverGateHook", note: "install merges the hook registration into an installed project's settings" }
      - { file: scripts/check-role.sh, symbol: "VALID_ROLES=" }
      - { file: scripts/detect-deliver-pr.sh, symbol: "readonly EXIT_NOT_DELIVER=3", note: "CI: deliver PRs detected by plan Branch: header, not branch prefix (#154)" }
    display_only:
      - { note: "the plan doc's Status: approved header is a mirror written by /rad-approve, never read as the gate" }
      - { file: scripts/rad-label.sh, note: "rad:* status labels on the issue/PR are a board mirror; branch tips stay canonical" }
    bypasses:
      - id: approve-on-behalf-of
        surface: "rad approve --on-behalf-of"
        guarded: "yes"
        note: "requires --evidence; the named approver must be the architect (check-role.sh); proxy provenance is recorded in the approved event"
      - id: custom-branch-prefix
        surface: "RAD_BRANCH_PREFIX other than rad/"
        guarded: "yes"
        note: "CI detects deliver PRs by plan content (scripts/detect-deliver-pr.sh), independent of the branch prefix (#154)"
      - id: codex-no-skill-hook
        surface: "Codex $rad-deliver skill"
        guarded: "yes"
        note: "Codex has no skill-level PreToolUse hook; the skill only runs rad deliver, whose harness gate refuses an unapproved plan; codex_implicit: false keeps it user-invoked"

  - id: approval-invalidated-by-plan-change
    claim: "A deliver run stops when the approved plan has changed since approval, rather than executing an unapproved revision."
    authority: "the plan fingerprint frozen into the approved event in .agents/state/<feature>/events.jsonl"
    evals: [harness/evals/approval.eval.js]
    enforced_by:
      - { file: harness/spine.js, symbol: "approvalChangeReason" }
      - { file: harness/spine.js, symbol: "'approval-changed'" }
      - { file: harness/cli.js, symbol: "makeApprovalIntact" }
      - { file: harness/spine.js, symbol: "Approval re-check fires before EVERY wave", note: "the re-check runs before the first wave too, not only between waves" }
      - { file: scripts/check-plan-approved.sh, symbol: "STORED_FP", note: "the deliver-gate path compares the frozen fingerprint" }
      - { file: harness/plan-fingerprint.js, symbol: "HEADER_CAPABILITIES_MARKER", note: "the plan-header Capabilities line is folded into the fingerprint, so widening it after approval invalidates the approval" }
      - { file: harness/spine.js, symbol: "export function approvedDuringRun", note: "an approved event recorded during the run stops it — re-approval happens between runs (#158)" }
    bypasses:
      - id: mid-run-self-approval
        surface: "rad approve run by the wave agent (shares the architect's git identity)"
        guarded: "yes"
        note: "the run refuses to act on any approved event after its deliver-started (checked before every wave and after the last); the event stays as evidence (#158)"

  - id: approval-blockers-refuse
    claim: "rad approve refuses to record approval while clarification markers remain or a high-risk path finding is neither resolved nor waived."
    authority: "the plan doc (NEEDS CLARIFICATION markers, Files in Scope, ## Waivers) as checked by scripts/check-approval-blockers.sh"
    evals: [harness/evals/approval.eval.js]
    enforced_by:
      - { file: scripts/check-approval-blockers.sh, symbol: "EXIT_BLOCKED" }
      - { file: harness/cli.js, symbol: "checkApprovalBlockers" }
      - { file: scripts/lib/plan-paths.sh, symbol: "plan_high_risk_pattern", note: "resolves the effective pattern env -> settings.high_risk_patterns -> default; an unreadable config fails closed (exit 2)" }
    bypasses:
      - id: high-risk-patterns-override
        surface: "RAD_HIGH_RISK_PATTERNS or settings.high_risk_patterns override"
        guarded: "yes"
        note: "empty env falls back to the config key, then the built-in default, and an empty config value is rejected by validation (can narrow, never disable); a non-default pattern from either source is frozen into approved.data.highRiskPattern and CI prints an advisory"
      - id: waivers-section
        surface: "## Waivers section in the plan doc"
        guarded: "yes"
        note: "waivers are frozen into approved.data.waivers; NEEDS CLARIFICATION markers cannot be waived"

  - id: scope-enforced
    claim: "A wave that touches files outside the plan's declared scope is classified fail-scope and resolved through the matrix, never silently accepted."
    authority: "the plan's Files in Scope table and per-task File: lines"
    evals: [harness/evals/delivery.eval.js]
    enforced_by:
      - { file: scripts/check-scope.sh, symbol: "scope_declares" }
      - { file: harness/spine.js, symbol: "SCOPE_FAIL_OUTCOME" }
      - { file: harness/matrix.yaml, symbol: "fail-scope:" }
      - { file: harness/cli.js, symbol: "SCRIPT_ARGS", note: "maps the spine's check-scope call to its real argv" }
      - { file: scripts/detect-deliver-pr.sh, symbol: "readonly EXIT_NOT_DELIVER=3", note: "CI: the scope check runs on every deliver PR regardless of branch prefix (#154)" }
    bypasses:
      - id: custom-branch-prefix
        surface: "RAD_BRANCH_PREFIX other than rad/"
        guarded: "yes"
        note: "CI detects deliver PRs by plan content (scripts/detect-deliver-pr.sh), independent of the branch prefix (#154)"

  - id: events-append-only
    claim: "Event logs are only ever appended to; no change may remove or modify an existing event line."
    authority: "the append-only event log .agents/state/<feature>/events.jsonl"
    evals: [harness/evals/repo.eval.js]
    enforced_by:
      - { file: scripts/check-events-append-only.sh, symbol: "git diff --name-only", note: "CI: fails on any removed/modified line in a touched log" }
      - { file: harness/adapters/git-state-store.js, symbol: "appendFileSync", note: "the writer only appends" }
    bypasses: []

  - id: self-protected-paths-flagged
    claim: "Any plan path touching RAD's own machinery (harness/, scripts/, .claude/, .agents/state/, .rad/, gates/matrix YAML) is always flagged for architect review, regardless of RAD_HIGH_RISK_PATTERNS."
    authority: "the RAD_SELF_PROTECTED_PATTERN literal in scripts/lib/plan-paths.sh"
    evals: [harness/evals/repo.eval.js]
    enforced_by:
      - { file: scripts/lib/plan-paths.sh, symbol: "readonly RAD_SELF_PROTECTED_PATTERN" }
      - { file: scripts/lib/plan-paths.sh, symbol: "(^|/)matrix\\.ya?ml$|^\\.rad/'", note: ".rad/ (the RAD config, #87) is part of the self-protected set" }
      - { file: scripts/lib/plan-paths.sh, symbol: "path_is_self_protected" }
      - { file: scripts/lint-plan.sh, symbol: "path_is_self_protected" }
    bypasses:
      - id: self-protected-advisory
        surface: "self-protected path findings are advisory"
        guarded: "no"
        note: "by design: lint-plan.sh warns for architect review; a self-protected finding is not an approval blocker"

  - id: rad-config-is-data
    claim: "RAD's roles, platform, default branch and agent scope map are read only from .rad/config.yml (never from CLAUDE.md prose), and that file is self-protected"
    authority: ".rad/config.yml"
    evals: [harness/evals/approval.eval.js]
    enforced_by:
      - { file: harness/config.js, symbol: "export const CONFIG_PATH = '.rad/config.yml'", note: "the single config location every reader resolves" }
      - { file: scripts/check-role.sh, symbol: "config get \"$ROLE_KEY\"", note: "role checks read roles.<key> via rad config get; no CLAUDE.md fallback" }
      - { file: scripts/get-default-branch.sh, symbol: "config get default_branch", note: "default branch read via rad config get" }
      - { file: scripts/lib/plan-paths.sh, symbol: "|^\\.rad/'", note: ".rad/config.yml is self-protected" }
    bypasses:
      - id: legacy-file-path-root-arg
        surface: "scripts accept a pre-#87 file-path argument (e.g. CLAUDE.md) as the repo root"
        guarded: "yes"
        note: "only the file's directory is used; data is still read from .rad/config.yml, never from the named file"

  - id: worktree-teardown-guarded
    claim: "Worktree teardown refuses to remove any directory that lacks the .rad-worktree.json marker."
    authority: "the .rad-worktree.json marker written at worktree creation"
    evals: [harness/evals/repo.eval.js]
    enforced_by:
      - { file: scripts/worktree-lifecycle.sh, symbol: "MARKER_NAME=\".rad-worktree.json\"" }
      - { file: scripts/worktree-lifecycle.sh, symbol: "refusing to remove" }
    bypasses: []

  - id: deliver-runs-isolated
    claim: "`rad deliver` runs wave agents in a dedicated git worktree by default, never in the operator's checkout; it switches a clean main checkout off the work branch, refuses a dirty one, and never falls back to the main checkout when worktree creation fails"
    authority: "the RAD_WORKTREE setting (only the exact value 0 opts out)"
    evals: [harness/evals/delivery.eval.js]
    enforced_by:
      - { file: harness/cli.js, symbol: "export function worktreeEnabled", note: "isolation is on unless RAD_WORKTREE is exactly 0" }
      - { file: harness/cli.js, symbol: "with uncommitted changes, so the worktree ", note: "ensureBranchFree/releaseMainCheckout: a dirty main checkout on the work branch exits 2" }
      - { file: harness/cli.js, symbol: "is already checked out in another worktree", note: "ensureBranchFree: a branch held by another worktree exits 2" }
      - { file: scripts/worktree-lifecycle.sh, symbol: "MARKER_NAME", note: "marks the isolated tree the run is rooted at" }
    bypasses:
      - { id: worktree-opt-out, surface: "RAD_WORKTREE=0", guarded: "no", note: "operator opt-out for environments where worktrees are impractical" }
      - { id: skill-deliver-path, surface: "/rad-deliver skill (Claude command and Codex skill)", guarded: "yes", note: "the skill no longer runs wave sub-agents itself; it only runs rad deliver, so the same worktree isolation (and the RAD_WORKTREE=0 opt-out above) applies (#186 part 3d)" }

  - id: resume-needs-decision-only
    claim: "A stopped deliver can be resumed only from a needs-decision stop; a failed stop cannot be resumed."
    authority: "the latest deliver-stopped event in .agents/state/<feature>/events.jsonl, classified by harness/stops.js"
    evals: [harness/evals/approval.eval.js]
    enforced_by:
      - { file: harness/cli.js, symbol: "resolveResume" }
      - { file: harness/cli.js, symbol: "cannot resume a failed stop" }
      - { file: harness/cli.js, symbol: "commitStopEvents", note: "a worktree-mode stop commits its event log so --resume sees it at the branch tip" }
      - { file: harness/stops.js, symbol: "STOP_CLASSES" }
    bypasses: []

  - id: hook-veto-fail-closed
    claim: "A veto-capable hook that crashes, exits non-zero, prints nothing, or prints an out-of-vocabulary token aborts the wave as abort-user."
    authority: "the frozen 7-outcome vocabulary in harness/matrix.yaml"
    evals: [harness/evals/delivery.eval.js]
    enforced_by:
      - { file: harness/hook-runner.js, symbol: "VETO_ABORT_OUTCOME" }
      - { file: harness/hook-runner.js, symbol: "createHookRunner" }
      - { file: harness/spine.js, symbol: "safeVetoOutcome" }
      - { file: harness/cli.js, symbol: "resolveHooksDir", note: "RAD_HOOKS_DIR resolution for the real deliver run" }
      - { file: harness/cli.js, symbol: "createHookRunner(", note: "the real deliver run wires the hook runner into the spine" }
    bypasses:
      - id: empty-hooks-dir
        surface: "RAD_HOOKS_DIR or settings.hooks_dir pointing at an empty directory"
        guarded: "no"
        note: "operator input; pointing at an empty dir removes all veto hooks"

  - id: verify-timeout-surfaces
    claim: "A declared Verify command that exceeds its timeout is reported as exit 124 and surfaces as fail-timeout rather than being retried as fail-tests."
    authority: "harness/matrix.yaml (fail-timeout maps to surface)"
    evals: [harness/evals/delivery.eval.js]
    enforced_by:
      - { file: scripts/check-verify.sh, symbol: "VERIFY_TIMEOUT_STATUS=124" }
      - { file: harness/spine.js, symbol: "'fail-timeout' : 'fail-tests'" }
    bypasses:
      - id: large-verify-timeout
        surface: "RAD_VERIFY_TIMEOUT_SECONDS set to a large value"
        guarded: "yes"
        note: "a malformed value exits 2; a large value only delays fail-timeout"

  - id: adapter-env-allow-listed
    claim: "The command agent adapter spawns RAD_AGENT_CMD (deliver waves) and RAD_REVIEW_AGENT_CMD / RAD_AGENT_CMD (the rad review lane), and the acp adapter spawns RAD_AGENT_CMD (deliver waves, its preflight and rad acp-check), with only the allow-listed environment variables, so no exported credential reaches any of these children."
    authority: "the ENV_ALLOW_LIST constant in harness/adapters/agent/command.js"
    evals: [harness/evals/delivery.eval.js]
    enforced_by:
      - { file: harness/adapters/agent/command.js, symbol: "ENV_ALLOW_LIST" }
      - { file: harness/adapters/agent/command.js, symbol: "export async function runCommandPrompt", note: "review lane runs through the same allow-listed spawn" }
      - { file: harness/adapters/agent/command.js, symbol: "export function buildChildEnv", note: "the allow-listed env builder both adapters share" }
      - { file: harness/adapters/agent/acp.js, symbol: "env: buildChildEnv()", note: "the acp spawn (waves, preflight, acp-check) uses the same allow-listed env" }
    bypasses:
      - id: preflight-off
        surface: "RAD_AGENT_PREFLIGHT=off"
        guarded: "no"
        note: "skips only the startup auth probe; the env allow-list still applies"

  - id: matrix-no-fallthrough
    claim: "An outcome or gate name with no declared entry throws instead of falling through to a default."
    authority: "harness/matrix.yaml and harness/gates.yaml"
    not_evalable: "pure table lookup with no agent-reachable surface; covered by harness/test/matrix.test.js and scripts/check-matrix-replay.sh"
    enforced_by:
      - { file: harness/matrix.js, symbol: "export function resolveOutcome" }
      - { file: harness/matrix.js, symbol: "(no default fallthrough)" }
      - { file: harness/gates.js, symbol: "No gate rule declared for gate" }
    bypasses: []

  - id: no-direct-push-to-default
    claim: "A wave agent that moves the default branch's remote tip during `rad deliver` fails the attempt with fail-protocol (abort). Detective, not preventive: the push has landed; the run stops and records it."
    authority: "the default branch's tip on the `origin` remote"
    evals: [harness/evals/delivery.eval.js]
    enforced_by:
      - { file: harness/spine.js, symbol: "pushGuardDemotion" }
      - { file: harness/spine.js, symbol: "PUSH_GUARD_SCRIPT" }
      - { file: scripts/default-tip.sh, symbol: "git ls-remote --heads", note: "reads the tip live from the remote, never a local tracking ref" }
      - { file: harness/cli.js, symbol: "pushGuard: true", note: "the real deliver run enables the guard" }
    bypasses:
      - { id: offline-remote, surface: "unreachable or unconfigured origin", guarded: "no", note: "records push-check-unavailable and does not demote (offline delivery stays possible)" }
      - { id: non-origin-push, surface: "push to another remote or non-default branch", guarded: "no", note: "only origin/<default> is watched; the wave contract forbids pushing" }

  - id: capabilities-enforced-or-refused
    claim: "A wave's declared Capabilities are either enforced by the agent adapter or the deliver run is refused (exit 2) before any event is appended; a constrained wave is never silently over-granted, and an explicit capability request is never silently dropped."
    authority: "harness/capabilities.js (CAPABILITY_CLASSES and resolveWaveCapabilities)"
    evals: [harness/evals/delivery.eval.js]
    enforced_by:
      - { file: harness/capabilities.js, symbol: "export function resolveWaveCapabilities", note: "explicit requests denied by .rad/config.yml capabilities.deny refuse, never drop" }
      - { file: harness/capabilities.js, symbol: "export function sdkAllowedTools", note: "an unmappable set fails closed, never widening to the default" }
      - { file: harness/cli.js, symbol: "const refusal = commandRefusal(resolved.byWave);", note: "the command adapter cannot restrict tools, so a narrowed wave refuses" }
      - { file: harness/cli.js, symbol: "const refusal = commandRefusal(resolved.byWave, 'acp');", note: "an ACP agent may act without asking permission, so a narrowed wave refuses on acp too" }
      - { file: harness/adapters/agent/sdk.js, symbol: "allowedTools: [...allowedTools]", note: "the per-wave allow-list reaches the SDK query" }
    bypasses:
      - id: skill-path
        surface: "the /rad-deliver skill path (Claude command and Codex skill)"
        guarded: "yes"
        note: "the skill only runs rad deliver, so every wave goes through the configured agent adapter, which enforces the wave's Capabilities or refuses the run; it no longer dispatches unrestricted sub-agents (#186 part 3d)"
      - id: shell-subsumes
        surface: "a wave granted the shell class"
        guarded: "no"
        note: "shell lets an agent reach the network and write files; classes are tool-level, not a sandbox"

  - id: preset-add-only
    claim: "A preset never overwrites a path another layer owns, and every install-preset refusal happens before any write."
    authority: "harness/install-manifest.js layer install + harness/preset.js PRESET_ROOTS"
    not_evalable: "install-time CLI with no agent-reachable surface; covered by harness/test/cli.test.js and scripts/test-install-harness.sh"
    enforced_by:
      - { file: harness/install-manifest.js, symbol: "ships paths another layer owns", note: "the layer apply throws on a conflicting plan before touching the filesystem" }
      - { file: harness/cli.js, symbol: "async function preparePresetInstall", note: "every refusal (invalid preset, no core, bad config, conflict, other preset) runs before any write" }
      - { file: harness/preset.js, symbol: "export const PRESET_ROOTS", note: "preset files may only land under these roots" }
    bypasses:
      - id: symlinked-target-dir
        surface: "a symlinked target directory (such as docs/)"
        guarded: "no"
        note: "written through, same as core; a symlink at the file path itself is never written through (kept as a local edit)"

  - id: acp-protocol-pinned
    claim: "An ACP agent that answers initialize with any protocolVersion other than 1 is refused before any prompt is sent."
    authority: "the ACP_PROTOCOL_VERSION constant in harness/adapters/agent/acp.js"
    not_evalable: "protocol handshake with no agent-reachable bypass; covered by harness/test/acp-adapter.test.js and rad acp-check"
    enforced_by:
      - { file: harness/adapters/agent/acp.js, symbol: "export const ACP_PROTOCOL_VERSION = 1;" }
      - { file: harness/adapters/agent/acp.js, symbol: "if (init?.protocolVersion !== ACP_PROTOCOL_VERSION) {", note: "initializeAgent throws fail-protocol before session/new or any session/prompt" }
      - { file: harness/adapters/agent/acp.js, symbol: "await initializeAgent(session);", note: "the handshake runs initialize first on every path (waves, preflight, acp-check)" }
    bypasses: []

  - id: generated-wrappers-match-source
    claim: "Every file carrying the generated marker equals what `rad generate` renders from its `.rad/` source, and no marked file lacks a source."
    authority: "harness/generate.js (planGenerate) and the .rad/ sources"
    not_evalable: "build-time check with no agent-reachable bypass; covered by the generated-drift CI job and harness/test/generate.test.js"
    enforced_by:
      - { file: harness/generate.js, symbol: "export function planGenerate", note: "renders every output and flags marked files with no source" }
      - { file: harness/generated-marker.js, symbol: "export const GENERATED_MARKER", note: "the marker that puts a file under the drift check" }
      - { file: .github/workflows/ci.yml, symbol: "node harness/cli.js generate --check", note: "generated-drift CI job" }
    bypasses:
      - id: unmarked-hand-edit
        surface: "a hand-written file without the generated marker"
        guarded: "no"
        note: "unmarked files are outside the drift check by design (e.g. the Claude rad-review command)"
