# RAD CI — thin GitHub Actions wrapper over the repo's standalone check scripts.
#
# Design invariant: ZERO check logic lives in this YAML. Every job is
# checkout + invoke; the checks themselves are scripts/*.sh and the harness
# test suite, all runnable locally with the exact command lines below. Other
# CI platforms wrap the same scripts. See docs/rad-cli.md → "CI checks".
name: RAD CI

on:
  pull_request:

jobs:
  # Layer 1 — harness unit/integration suite (node --test).
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Full install (NOT --omit=optional): the adapter tests import
      # @anthropic-ai/claude-agent-sdk directly, so omitting the optional SDK
      # breaks test/agent-adapters.test.js and test/cost.test.js.
      # Verified locally: `npm ci --prefix harness && npm test --prefix harness`.
      - run: npm ci --prefix harness
      # The approve-path test fixtures read the runner's real git identity
      # (harness/test/cli.test.js derives the expected actor from
      # `git config user.email`); GitHub runners ship with none, so set one.
      - name: Set git identity for test fixtures
        run: |
          git config --global user.name "RAD CI"
          git config --global user.email "ci@rad-ci.local"
      - run: npm test --prefix harness

  # Layer 1 — shell self-tests for every scripts/test-*.sh.
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/test-*.sh
        run: |
          failed=0
          for t in scripts/test-*.sh; do
            if out=$(bash "$t" 2>&1); then
              echo "PASS $t"
            else
              echo "FAIL $t"
              echo "$out"
              failed=1
            fi
          done
          exit "$failed"

  # All PRs — event logs are append-only audit trails (fail-closed).
  events-append-only:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the check diffs against the PR base sha, which a
      # shallow clone may not contain. Full history costs extra fetch time on
      # large repos; accepted so the diff range is always resolvable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-events-append-only.sh "${{ github.event.pull_request.base.sha }}"

  # All PRs — agent frontmatter lint + CLAUDE.md scope-map sync (fail-closed).
  # KNOWN: this job currently fails on pre-existing scope-map drift in the
  # real tree; the drift reconciliation lands before merge. Wired fail-closed
  # anyway per AC#6 — the lint must gate, not advise.
  agent-file-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint-agent-files.sh

  # All PRs — shell-safety lint over scripts/ (fail-closed; baseline-gated warnings).
  shell-safety-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint-shell-safety.sh

  # Deliver PRs only — approval integrity at the PR head (ancestry +
  # fingerprint + gate + authenticity, with an advisory-only ownership check).
  # Ordinary PRs: the job-level `if` skips non-rad/ branches entirely (skipped
  # reads as success), and the detect step below emits an explicit skip notice
  # for rad/ branches that carry no plan file.
  deliver-integrity:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'rad/')
    steps:
      # fetch-depth: 0 — ancestry (merge-base --is-ancestor) and the
      # origin/<work-branch> events-log resolution need full history; a
      # shallow clone would fail closed on an undeterminable ancestry.
      # Costs a full fetch; accepted for correctness.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect deliver PR (rad/ branch + matching plan file)
        id: detect
        run: |
          feature="${GITHUB_HEAD_REF#rad/}"
          if [ -f ".agents/plans/${feature}.md" ]; then
            echo "deliver PR detected: plan .agents/plans/${feature}.md exists for branch ${GITHUB_HEAD_REF}"
          else
            echo "notice: branch ${GITHUB_HEAD_REF} has no plan file .agents/plans/${feature}.md — not a deliver PR; skipping approval-integrity check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check approval integrity
        if: steps.detect.outputs.skip != 'true'
        # The re-emit loop below is output plumbing, not check logic: it
        # surfaces the script's "advisory:" ownership lines as GitHub warning
        # annotations. pipefail preserves the script's exit code unchanged.
        run: |
          set -o pipefail
          scripts/check-approval-integrity.sh "${{ github.head_ref }}" "${{ github.base_ref }}" 2>&1 | while IFS= read -r line; do
            case "$line" in
              advisory:*) echo "::warning::$line" ;;
            esac
            printf '%s\n' "$line"
          done
      - name: Check plan scope
        if: steps.detect.outputs.skip != 'true'
        # Fail-closed: a non-zero exit (out-of-scope files, usage error) fails
        # the job and blocks merge. The work branch is passed origin-prefixed
        # because the PR checkout is a detached merge ref — the bare branch
        # name would not resolve and the script's diff would come up empty.
        run: scripts/check-scope.sh ".agents/plans/${GITHUB_HEAD_REF#rad/}.md" "origin/${{ github.head_ref }}" "${{ github.base_ref }}"

  # All PRs touching .agents/plans/** — plan lint (ADVISORY, never gates merge).
  # continue-on-error keeps the job green on lint failure; findings surface as
  # warning annotations only.
  plan-lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the changed-plan detection diffs against the PR base
      # sha, which a shallow clone may not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint changed plan files
        continue-on-error: true
        # The diff|grep detection and re-emit loop are output plumbing, not
        # check logic: the lint itself is scripts/lint-plan.sh, runnable
        # locally with the same command line.
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- '.agents/plans/*.md')
          if [ -z "$changed" ]; then
            echo "notice: no plan files changed vs base — skipping plan lint"
            exit 0
          fi
          rc=0
          for plan in $changed; do
            [ -f "$plan" ] || continue   # deleted plan — nothing to lint
            echo "linting $plan"
            if ! out=$(scripts/lint-plan.sh "$plan" 2>&1); then rc=1; fi
            printf '%s\n' "$out"
            printf '%s\n' "$out" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning file=$plan::$line"
            done
          done
          exit "$rc"
