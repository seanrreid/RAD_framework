# RAD CI — thin GitHub Actions wrapper over the repo's standalone check scripts.
#
# Design invariant: ZERO check logic lives in this YAML. Every job is
# checkout + invoke; the checks themselves are scripts/*.sh and the harness
# test suite, all runnable locally with the exact command lines below. Other
# CI platforms wrap the same scripts. See docs/rad-cli.md → "CI checks".
name: RAD CI

on:
  pull_request:

jobs:
  # Layer 1 — harness unit/integration suite (node --test).
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Full install (NOT --omit=optional): the adapter tests import
      # @anthropic-ai/claude-agent-sdk directly, so omitting the optional SDK
      # breaks test/agent-adapters.test.js and test/cost.test.js.
      # Verified locally: `npm ci --prefix harness && npm test --prefix harness`.
      - run: npm ci --prefix harness
      # The approve-path test fixtures read the runner's real git identity
      # (harness/test/cli.test.js derives the expected actor from
      # `git config user.email`); GitHub runners ship with none, so set one.
      - name: Set git identity for test fixtures
        run: |
          git config --global user.name "RAD CI"
          git config --global user.email "ci@rad-ci.local"
      - run: npm test --prefix harness

  # Layer 1 — shell self-tests for every scripts/test-*.sh.
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/test-*.sh
        run: |
          failed=0
          for t in scripts/test-*.sh; do
            if out=$(bash "$t" 2>&1); then
              echo "PASS $t"
            else
              echo "FAIL $t"
              echo "$out"
              failed=1
            fi
          done
          exit "$failed"

  # Layer 1 — bash 3.2 parse check over scripts/ (macOS ships /bin/bash 3.2).
  # The script SKIPs where no 3.2 exists (e.g. ubuntu script-tests); here a
  # SKIP means the runner image lost 3.2, so the guard below fails loudly.
  bash32-parse:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scripts/test-bash32-parse.sh
        run: |
          rc=0
          out=$(bash scripts/test-bash32-parse.sh 2>&1) || rc=$?
          printf '%s\n' "$out"
          # Anchored: the script's own self-test lines mention SKIP mid-line.
          if printf '%s\n' "$out" | grep -q '^SKIP:'; then
            echo "::error::bash 3.2 not found on runner — parse check skipped"; exit 1
          fi
          exit "$rc"

  # All PRs — event logs are append-only audit trails (fail-closed).
  events-append-only:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the check diffs against the PR base sha, which a
      # shallow clone may not contain. Full history costs extra fetch time on
      # large repos; accepted so the diff range is always resolvable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-events-append-only.sh "${{ github.event.pull_request.base.sha }}"

  # All PRs — agent frontmatter lint + CLAUDE.md scope-map sync (fail-closed).
  # KNOWN: this job currently fails on pre-existing scope-map drift in the
  # real tree; the drift reconciliation lands before merge. Wired fail-closed
  # anyway per AC#6 — the lint must gate, not advise.
  agent-file-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint-agent-files.sh

  # All PRs — CLAUDE.md line budget, ADVISORY (#87): warns over budget, fails only on a missing file.
  claude-md-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint-claude-md.sh

  # All PRs — shell-safety lint over scripts/ (fail-closed; baseline-gated warnings).
  shell-safety-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint-shell-safety.sh

  # All PRs — invariant registry lint (fail-closed): every claim in
  # docs/invariants.yaml must resolve to a live enforcement anchor.
  # setup-node: the lint shells out to node to parse the YAML registry.
  invariant-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: scripts/lint-invariants.sh

  # All PRs — generated-file drift (fail-closed, #171): every Claude and Codex
  # output must match its .rad/ source, and no marked orphan may remain.
  # Thin wrapper: the same command runs on any runner. No sources yet: exits 0.
  generated-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node harness/cli.js generate --check

  # All PRs — scripted adversarial gate evals (blocking): each case attacks a
  # registry invariant in a throwaway fixture repo with a scripted adversary.
  # Thin wrapper: the same command runs on any runner. Live-agent lane is manual.
  evals-scripted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test harness/evals/*.eval.js

  # Deliver PRs only — approval integrity at the PR head (ancestry +
  # fingerprint + gate + authenticity, with an advisory-only ownership check).
  # Detection is content-based (#154): scripts/detect-deliver-pr.sh matches the
  # PR head ref against each plan's `Branch:` header, so any RAD_BRANCH_PREFIX
  # is covered. Ordinary PRs (exit 3) get an explicit skip notice; an ambiguous
  # match or bad input fails the job closed.
  deliver-integrity:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — ancestry (merge-base --is-ancestor) and the
      # origin/<work-branch> events-log resolution need full history; a
      # shallow clone would fail closed on an undeterminable ancestry.
      # Costs a full fetch; accepted for correctness.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect deliver PR (plan whose Branch matches the head ref)
        id: detect
        run: |
          set +e
          feature="$(scripts/detect-deliver-pr.sh "$GITHUB_HEAD_REF" 2>"$RUNNER_TEMP/detect.err")"
          code=$?
          set -e
          case "$code" in
            0)
              echo "deliver PR detected: plan .agents/plans/${feature}.md declares Branch: ${GITHUB_HEAD_REF}"
              echo "feature=${feature}" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "notice: no plan declares Branch: ${GITHUB_HEAD_REF} — not a deliver PR; skipping approval-integrity and scope checks"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::detect-deliver-pr.sh exited ${code}: $(tr '\n' ' ' < "$RUNNER_TEMP/detect.err")"
              exit 1
              ;;
          esac
      # Node is needed only by the review-digest step (harness/cli.js digest).
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.skip != 'true'
        with:
          node-version: 20
      - name: Check approval integrity
        if: steps.detect.outputs.skip != 'true'
        # The re-emit loop below is output plumbing, not check logic: it
        # surfaces the script's "advisory:" ownership lines as GitHub warning
        # annotations. pipefail preserves the script's exit code unchanged.
        run: |
          set -o pipefail
          scripts/check-approval-integrity.sh "${{ github.head_ref }}" "${{ github.base_ref }}" 2>&1 | while IFS= read -r line; do
            case "$line" in
              advisory:*) echo "::warning::$line" ;;
            esac
            printf '%s\n' "$line"
          done
      - name: Check plan scope
        if: steps.detect.outputs.skip != 'true'
        # Fail-closed: a non-zero exit (out-of-scope files, usage error) fails
        # the job and blocks merge. The work branch is passed origin-prefixed
        # because the PR checkout is a detached merge ref — the bare branch
        # name would not resolve and the script's diff would come up empty.
        run: scripts/check-scope.sh ".agents/plans/${{ steps.detect.outputs.feature }}.md" "origin/${{ github.head_ref }}" "${{ github.base_ref }}"
      - name: Review digest (job summary)
        if: always() && steps.detect.outputs.skip != 'true'
        # Advisory, never a gate: the ranked digest is appended to the job
        # summary; a digest failure is surfaced as a warning annotation and the
        # step still exits 0. Refs are origin-prefixed (detached merge checkout,
        # full history fetched above).
        run: |
          set +e
          node harness/cli.js digest "${{ steps.detect.outputs.feature }}" --branch "origin/${GITHUB_HEAD_REF}" --base "origin/${GITHUB_BASE_REF}" > "$RUNNER_TEMP/digest.md" 2>"$RUNNER_TEMP/digest.err"
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            cat "$RUNNER_TEMP/digest.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::review digest failed (exit ${code}): $(tr '\n' ' ' < "$RUNNER_TEMP/digest.err")"
          fi
          exit 0

  # All PRs touching .agents/plans/** — plan lint (ADVISORY, never gates merge).
  # continue-on-error keeps the job green on lint failure; findings surface as
  # warning annotations only.
  plan-lint:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the changed-plan detection diffs against the PR base
      # sha, which a shallow clone may not contain.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint changed plan files
        continue-on-error: true
        # The diff|grep detection and re-emit loop are output plumbing, not
        # check logic: the lint itself is scripts/lint-plan.sh, runnable
        # locally with the same command line.
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- '.agents/plans/*.md')
          if [ -z "$changed" ]; then
            echo "notice: no plan files changed vs base — skipping plan lint"
            exit 0
          fi
          rc=0
          for plan in $changed; do
            [ -f "$plan" ] || continue   # deleted plan — nothing to lint
            echo "linting $plan"
            if ! out=$(scripts/lint-plan.sh "$plan" 2>&1); then rc=1; fi
            printf '%s\n' "$out"
            printf '%s\n' "$out" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::warning file=$plan::$line"
            done
          done
          exit "$rc"

  # PRs touching harness/matrix.yaml or harness/gates.yaml — replay recorded
  # event logs under the changed tables. Divergences are ADVISORY (re-emitted
  # as warning annotations); a mechanical failure (script exit non-zero)
  # fails the job. Not continue-on-error.
  matrix-replay:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the table-change detection diffs against the PR base
      # sha, and the replay reads refs/remotes/origin/rad/* tip logs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Transport only: guarantee the rad/* remote-tracking refs exist the
      # script reads (it never fetches itself). A glob matching no branch is
      # a no-op, not an error.
      - name: Fetch rad/* work-branch tips
        run: git fetch --no-tags origin '+refs/heads/rad/*:refs/remotes/origin/rad/*'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay event logs under changed tables
        # The diff detection and re-emit loop are output plumbing, not check
        # logic: the replay itself is scripts/check-matrix-replay.sh, runnable
        # locally with the same command line.
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base"...HEAD -- harness/matrix.yaml harness/gates.yaml)
          if [ -z "$changed" ]; then
            echo "matrix-replay: no table change — skipped"
            exit 0
          fi
          rc=0
          out=$(scripts/check-matrix-replay.sh --base "$base" 2>&1) || rc=$?
          printf '%s\n' "$out" | while IFS= read -r line; do
            case "$line" in
              divergence:*) echo "::warning::$line" ;;
              *) printf '%s\n' "$line" ;;
            esac
          done
          exit "$rc"
